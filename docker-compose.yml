services:

  backend:
    build:
      context: ./backend

    container_name: petokra_backend

    working_dir: /app

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

    command: python src/manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:17

    container_name: petokra_postgres

    environment:
      POSTGRES_DB: petokra
      POSTGRES_USER: petokra
      POSTGRES_PASSWORD: petokra

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine

    container_name: petokra_redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: